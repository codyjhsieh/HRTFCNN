name: Deploy offline-llm-webgpu to GitHub Pages

# Publishes the offline LLM web app (offline-llm-webgpu/) to GitHub Pages.
# The app is served at:  https://<owner>.github.io/<repo>/

on:
  push:
    branches: [claude/iphone-15-ml-capabilities-VkqXn]
    paths:
      - "offline-llm-webgpu/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only the app folder is published, so it lives at the Pages root.
          path: offline-llm-webgpu

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
